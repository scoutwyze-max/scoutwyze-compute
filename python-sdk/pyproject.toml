[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scoutwyze-compute"
version = "0.1.0"
description = "Client + LangChain/Haystack Tool wrappers for the ScoutWyze Compute GPU-placement ranking API (dual-rail: prepaid key or x402/USDC on Base)"
readme = "README.md"
license = "MIT"
authors = [{ name = "ScoutWyze", email = "scoutwyze@gmail.com" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
x402 = ["eth_account"]
langchain = ["langchain-core", "pydantic"]
haystack = ["haystack-ai"]
all = ["eth_account", "langchain-core", "pydantic", "haystack-ai"]

[project.urls]
Homepage = "https://scoutwyze-compute.fly.dev"
Repository = "https://github.com/scoutwyze-max/scoutwyze-compute"
Issues = "https://github.com/scoutwyze-max/scoutwyze-compute/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scoutwyze_compute"]
